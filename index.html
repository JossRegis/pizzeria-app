<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Contrôle Comptabilité</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }
#dropZone {
  border:2px dashed #ff6600;
  padding:40px;
  margin:20px;
  border-radius:10px;
}
img { max-width:300px; margin-top:10px; }
button { padding:10px; margin:5px; background:#ff6600; border:none; border-radius:6px; color:white; }
</style>
</head>

<body>

<h2>Contrôle Comptabilité</h2>

<div id="dropZone">Glisse une image ici (Discord OK)</div>

<input type="file" accept="image/*" onchange="loadFile(event)">
<br>
<img id="preview">
<br><br>

<button onclick="analyser()">Vérifier</button>

<div id="resultat"></div>

<script>

let imageSrc = null;

// ==========================
// 🔥 CLEAN
// ==========================
function clean(txt) {
  return String(txt)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\- ]/g, "")
    .trim();
}

function nettoyerMontant(val) {
  return Number(String(val).replace(/[^\d]/g, ""));
}

// ==========================
// UPLOAD CLASSIQUE
// ==========================
function loadFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  imageSrc = URL.createObjectURL(file);
  preview.src = imageSrc;
}

// ==========================
// 🔥 DRAG & DROP FIX COMPLET
// ==========================
const dropZone = document.getElementById("dropZone");

dropZone.addEventListener("dragover", e => {
  e.preventDefault();
  dropZone.style.borderColor = "green";
});

dropZone.addEventListener("dragleave", () => {
  dropZone.style.borderColor = "#ff6600";
});

dropZone.addEventListener("drop", async e => {
  e.preventDefault();
  dropZone.style.borderColor = "#ff6600";

  // 🔥 1. fichiers classiques
  if (e.dataTransfer.files.length > 0) {
    const file = e.dataTransfer.files[0];
    imageSrc = URL.createObjectURL(file);
    preview.src = imageSrc;
    return;
  }

  // 🔥 2. images Discord (URL)
  const url = e.dataTransfer.getData("text/uri-list");

  if (url) {
    try {
      const res = await fetch(url);
      const blob = await res.blob();
      imageSrc = URL.createObjectURL(blob);
      preview.src = imageSrc;
    } catch {
      alert("Impossible de charger l'image (Discord)");
    }
  }
});

// ==========================
// 🔥 EXTRACTION CLIENT MULTILIGNE
// ==========================
function extraire(txt) {

  txt = txt.replace(/\r/g, "");
  let lignes = txt.split("\n");

  let bloc = "";

  for (let i = 0; i < lignes.length; i++) {
    if (lignes[i].toLowerCase().includes("détail")) {
      bloc = lignes[i] + " " + (lignes[i+1] || "");
      break;
    }
  }

  let ligne = bloc || txt;
  let lower = ligne.toLowerCase();

  let date = (txt.match(/(\d{2}\/\d{2}\/\d{4})/)||[])[1] || "";
  if (date) {
    let p = date.split("/");
    date = p[0]+"/"+p[1]+"/"+p[2].slice(-2);
  }

  let vendeur = "";
  if (lower.includes("envoyée par")) {
    vendeur = lower.split("envoyée par")[1].split("à")[0];
  }

  let client = "";
  if (lower.includes("à") && lower.includes("pour")) {
    let part = lower.split("à")[1].split("pour")[0];
    let mots = part.trim().split(" ");
    client = (mots[0]||"")+" "+(mots[1]||"");
  }

  let montant = (txt.match(/Montant:\s*([\d,\.]+)/i)||[])[1] || 0;

  let facture = (txt.match(/Note\s*:\s*([A-Z0-9\-]+)/i)||[])[1] || "";

  return {
    date,
    vendeur: clean(vendeur),
    client: clean(client),
    facture: clean(facture),
    montant: nettoyerMontant(montant)
  };
}

// ==========================
// ANALYSE
// ==========================
async function analyser() {

  if (!imageSrc) {
    alert("Ajoute une image !");
    return;
  }

  const result = await Tesseract.recognize(imageSrc, 'fra');
  const txt = result.data.text;

  const data = extraire(txt);

  const res = await fetch("https://script.google.com/macros/s/AKfycbxd0neBvcwoucF8snN2MrXtesc0SIUWqlJsK4aO2fDKhsP2SBPqZirr3iIK-1QB9Lpj/exec", {
    method: "POST",
    body: JSON.stringify(data)
  });

  const json = await res.json();

  document.getElementById("resultat").innerHTML = `
    <h3>${json.statut}</h3>
    Client : ${data.client}<br>
    Facture : ${data.facture}<br>
    Montant : ${data.montant}
  `;
}

</script>

</body>
</html>
