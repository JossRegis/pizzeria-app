<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Contrôle Comptabilité</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }
#dropZone { border:2px dashed #ff6600; padding:40px; margin:20px; border-radius:10px; }
img { max-width:300px; margin-top:10px; }
button { padding:10px; margin:5px; background:#ff6600; border:none; border-radius:6px; color:white; }
#resultat { margin-top:20px; padding:15px; border:1px solid #444; }
</style>
</head>

<body>

<h2>Contrôle Comptabilité</h2>

<div id="dropZone">Glisse une image ici</div>

<input type="file" accept="image/*" onchange="loadFile(event)">

<br>

<img id="preview">

<br><br>

<button onclick="analyser()">Vérifier</button>

<div id="resultat"></div>

<script>

let imageSrc = null;
let listeProduits = [];

// ==========================
// CHARGER PRODUITS
// ==========================
async function chargerProduits() {
  const res = await fetch("https://script.google.com/macros/s/AKfycbxd0neBvcwoucF8snN2MrXtesc0SIUWqlJsK4aO2fDKhsP2SBPqZirr3iIK-1QB9Lpj/exec");
  listeProduits = await res.json();
}
chargerProduits();

// ==========================
// UPLOAD
// ==========================
function loadFile(e) {
  const file = e.target.files[0];
  imageSrc = URL.createObjectURL(file);
  preview.src = imageSrc;
}

// ==========================
// DRAG DROP
// ==========================
const dropZone = document.getElementById("dropZone");

dropZone.ondragover = e => e.preventDefault();

dropZone.ondrop = async e => {
  e.preventDefault();

  const items = e.dataTransfer.items;

  for (let item of items) {

    if (item.kind === "file") {
      const file = item.getAsFile();
      imageSrc = URL.createObjectURL(file);
      preview.src = imageSrc;
    }

    if (item.kind === "string") {
      item.getAsString(async (url) => {
        try {
          const res = await fetch(url);
          const blob = await res.blob();
          imageSrc = URL.createObjectURL(blob);
          preview.src = imageSrc;
        } catch {
          alert("Image non accessible");
        }
      });
    }
  }
};

// ==========================
// NORMALISATION PRODUIT
// ==========================
function normaliserProduit(p) {

  if (!p) return { nom:"", prix:0 };

  p = p.toLowerCase().trim();

  let meilleur = null;
  let scoreMax = 0;

  listeProduits.forEach(prod => {

    let nom = prod.nom.toLowerCase();
    let score = 0;

    nom.split(" ").forEach(mot => {
      if (p.includes(mot)) score++;
    });

    if (score > scoreMax) {
      scoreMax = score;
      meilleur = prod;
    }
  });

  return meilleur || { nom:p, prix:0 };
}

// ==========================
// EXTRACTION OCR
// ==========================
function extraire(txt) {

  let date = (txt.match(/Date de l'opération:\s*(\d{2}\/\d{2}\/\d{4})/i) || [])[1] || "";
  let vendeur = (txt.match(/Envoyée par (.+) à/i) || [])[1] || "";
  let client = (txt.match(/à (.+?) pour/i) || [])[1] || "";
  let montant = (txt.match(/Montant:\s*([\d,\.]+)/i) || [])[1] || 0;
  let facture = (txt.match(/Note\s*:?(\d+)/i) || [])[1] || "";

  return {
    date: date,
    vendeur: vendeur.toLowerCase().trim(),
    client: client.toLowerCase().trim(),
    facture: facture,
    montant: Number(String(montant).replace(",", "").replace(".", ""))
  };
}

// ==========================
// ANALYSE
// ==========================
async function analyser() {

  if (!imageSrc) {
    alert("Ajoute une image !");
    return;
  }

  const result = await Tesseract.recognize(imageSrc, 'fra');
  const txt = result.data.text;

  const data = extraire(txt);

  const res = await fetch("https://script.google.com/macros/s/AKfycbxd0neBvcwoucF8snN2MrXtesc0SIUWqlJsK4aO2fDKhsP2SBPqZirr3iIK-1QB9Lpj/exec", {
    method: "POST",
    body: JSON.stringify(data)
  });

  const json = await res.json();

  afficherResultat(data, json);
}

// ==========================
// AFFICHAGE
// ==========================
function afficherResultat(data, res) {

  let couleur = "#999";
  let texte = "";

  if (res.statut === "FOUND") {
    couleur = "green";
    texte = "✅ OK";
  } else if (res.statut === "MISMATCH") {
    couleur = "orange";
    texte = "⚠️ Montant incorrect";
  } else {
    couleur = "red";
    texte = "❌ Aucun résultat";
  }

  document.getElementById("resultat").innerHTML = `
    <h3 style="color:${couleur}">${texte}</h3>

    <b>Date :</b> ${data.date}<br>
    <b>Vendeur :</b> ${data.vendeur}<br>
    <b>Client :</b> ${data.client}<br>
    <b>Facture :</b> ${data.facture}<br>

    <hr>

    <b>Montant image :</b> ${data.montant}<br>
    <b>Total trouvé :</b> ${res.totalSheet}<br>

    <b>Lignes trouvées :</b> ${res.lignes.join(", ")}
  `;
}

</script>

</body>
</html>
