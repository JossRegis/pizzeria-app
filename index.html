<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Contrôle Comptabilité</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }
#dropZone { border:2px dashed #ff6600; padding:40px; margin:20px; border-radius:10px; }
img { max-width:300px; margin-top:10px; }
button { padding:10px; margin:5px; background:#ff6600; border:none; border-radius:6px; color:white; }
#resultat { margin-top:20px; padding:15px; border:1px solid #444; }
</style>
</head>

<body>

<h2>Contrôle Comptabilité</h2>

<div id="dropZone">Glisse une image ici</div>

<input type="file" accept="image/*" onchange="loadFile(event)">

<br>

<img id="preview">

<br><br>

<button onclick="analyser()">Vérifier</button>

<div id="resultat"></div>

<script>

let imageSrc = null;

// ==========================
// 🔧 NETTOYAGE TEXTE
// ==========================
function clean(txt) {
  return String(txt)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

// ==========================
// 🔧 NETTOYAGE MONTANT
// ==========================
function nettoyerMontant(val) {
  return Number(
    String(val)
      .replace(/\s/g, "")
      .replace(",", "")
      .replace(".", "")
      .replace(/[^\d]/g, "")
  );
}

// ==========================
// UPLOAD
// ==========================
function loadFile(e) {
  const file = e.target.files[0];
  imageSrc = URL.createObjectURL(file);
  preview.src = imageSrc;
}

// ==========================
// DRAG DROP
// ==========================
const dropZone = document.getElementById("dropZone");

dropZone.ondragover = e => e.preventDefault();

dropZone.ondrop = e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  imageSrc = URL.createObjectURL(file);
  preview.src = imageSrc;
};

// ==========================
// EXTRACTION OCR (CORRIGÉE)
// ==========================
function extraire(txt) {

  // 🔥 correction OCR multi-ligne
  txt = txt.replace(/\n/g, " ");
  txt = txt.replace(/\s+/g, " ");

  // date
  let dateMatch = txt.match(/(\d{2}\/\d{2}\/\d{4})/);
  let date = dateMatch ? dateMatch[1] : "";

  if (date) {
    let p = date.split("/");
    date = p[0] + "/" + p[1] + "/" + p[2].slice(-2);
  }

  // vendeur
  let vendeurMatch = txt.match(/Envoyée par (.+?) à/i);
  let vendeur = vendeurMatch ? vendeurMatch[1] : "";

  // 🔥 CLIENT FIX
  let clientMatch = txt.match(/à\s+(.+?)\s+pour/i);
  let client = clientMatch ? clientMatch[1] : "";

  // montant
  let montantMatch = txt.match(/Montant:\s*([\d,\.]+)/i);
  let montant = montantMatch ? montantMatch[1] : 0;

  // facture
  let factureMatch = txt.match(/Note\s*:?(\d+)/i);
  let facture = factureMatch ? factureMatch[1] : "";

  return {
    date: date,
    vendeur: clean(vendeur),
    client: clean(client),
    facture: clean(facture),
    montant: nettoyerMontant(montant)
  };
}

// ==========================
// ANALYSE
// ==========================
async function analyser() {

  if (!imageSrc) {
    alert("Ajoute une image !");
    return;
  }

  const result = await Tesseract.recognize(imageSrc, 'fra');
  const txt = result.data.text;

  console.log("OCR :", txt);

  const data = extraire(txt);

  console.log("DATA :", data);

  const res = await fetch("https://script.google.com/macros/s/AKfycbxd0neBvcwoucF8snN2MrXtesc0SIUWqlJsK4aO2fDKhsP2SBPqZirr3iIK-1QB9Lpj/exec", {
    method: "POST",
    body: JSON.stringify(data)
  });

  const json = await res.json();

  afficherResultat(data, json);
}

// ==========================
// AFFICHAGE
// ==========================
function afficherResultat(data, res) {

  let couleur = "white";
  let texte = "";

  if (res.statut === "FOUND") {
    couleur = "green";
    texte = "✅ OK";
  } else if (res.statut === "MISMATCH") {
    couleur = "orange";
    texte = "⚠️ Montant incorrect";
  } else {
    couleur = "red";
    texte = "❌ Aucun résultat";
  }

  document.getElementById("resultat").innerHTML = `
    <h3 style="color:${couleur}">${texte}</h3>

    Date : ${data.date}<br>
    Vendeur : ${data.vendeur}<br>
    Client : ${data.client}<br>
    Facture : ${data.facture}<br>

    <hr>

    Montant image : ${data.montant}<br>
    Total trouvé : ${res.totalSheet}<br>

    Lignes : ${res.lignes.join(", ")}
  `;
}

</script>

</body>
</html>
