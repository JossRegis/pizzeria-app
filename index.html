<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Contrôle Comptabilité</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }
#dropZone { border:2px dashed #ff6600; padding:40px; margin:20px; border-radius:10px; }
img { max-width:300px; margin-top:10px; }
button { padding:10px; margin:5px; background:#ff6600; border:none; border-radius:6px; color:white; }
#resultat { margin-top:20px; padding:15px; border:1px solid #444; }
</style>
</head>

<body>

<h2>Contrôle Comptabilité</h2>

<div id="dropZone">Glisse une image ici</div>

<input type="file" accept="image/*" onchange="loadFile(event)">

<br>

<img id="preview">

<br><br>

<button onclick="analyser()">Vérifier</button>

<div id="resultat"></div>

<script>

let imageSrc = null;

// ==========================
// 🔧 CLEAN TEXTE
// ==========================
function clean(txt) {
  return String(txt)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\- ]/g, "")
    .trim();
}

// ==========================
// 🔧 NETTOYAGE MONTANT
// ==========================
function nettoyerMontant(val) {
  return Number(
    String(val)
      .replace(/\s/g, "")
      .replace(",", "")
      .replace(".", "")
      .replace(/[^\d]/g, "")
  );
}

// ==========================
// UPLOAD
// ==========================
function loadFile(e) {
  const file = e.target.files[0];
  imageSrc = URL.createObjectURL(file);
  preview.src = imageSrc;
}

// ==========================
// DRAG DROP
// ==========================
const dropZone = document.getElementById("dropZone");

dropZone.ondragover = e => e.preventDefault();

dropZone.ondrop = e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  imageSrc = URL.createObjectURL(file);
  preview.src = imageSrc;
};

// ==========================
// 🔥 EXTRACTION FINALE
// ==========================
function extraire(txt) {

  // ==========================
  // 🔥 NORMALISATION TEXTE
  // ==========================
  txt = txt.replace(/\r/g, "");
  let lignes = txt.split("\n");

  let ligneDetails = "";

  // 🔥 trouver la ligne "Détails"
  lignes.forEach(l => {
    if (l.toLowerCase().includes("détail")) {
      ligneDetails = l;
    }
  });

  let ligne = ligneDetails || txt;

  let ligneLower = ligne.toLowerCase();

  // ==========================
  // 📅 DATE
  // ==========================
  let dateMatch = txt.match(/(\d{2}\/\d{2}\/\d{4})/);
  let date = dateMatch ? dateMatch[1] : "";

  if (date) {
    let p = date.split("/");
    date = p[0] + "/" + p[1] + "/" + p[2].slice(-2);
  }

  // ==========================
  // 👤 VENDEUR
  // ==========================
  let vendeur = "";

  if (ligneLower.includes("envoyée par")) {
    let part = ligneLower.split("envoyée par")[1];
    vendeur = part.split("à")[0] || "";
  }

  // ==========================
  // 🔥 CLIENT (DÉTAILS UNIQUEMENT)
  // ==========================
  let client = "";

  if (ligneLower.includes("à")) {

    let partApresA = ligneLower.split("à")[1];

    if (partApresA.includes("pour")) {
      partApresA = partApresA.split("pour")[0];
    }

    let mots = partApresA.trim().split(" ");

    client = (mots[0] || "") + " " + (mots[1] || "");
  }

  // ==========================
  // 💰 MONTANT
  // ==========================
  let montantMatch = txt.match(/Montant:\s*([\d,\.]+)/i);
  let montant = montantMatch ? montantMatch[1] : 0;

  // ==========================
  // 🧾 FACTURE
  // ==========================
  let facture = "";
  let factureMatch = txt.match(/Note\s*:\s*([A-Z0-9\-]+)/i);

  if (factureMatch) {
    facture = factureMatch[1];
  }

  return {
    date: date,
    vendeur: clean(vendeur),
    client: clean(client),
    facture: clean(facture),
    montant: nettoyerMontant(montant)
  };
}

  // MONTANT
  let montantMatch = txt.match(/Montant:\s*([\d,\.]+)/i);
  let montant = montantMatch ? montantMatch[1] : 0;

  // FACTURE
  let facture = "";
  let factureMatch = txt.match(/Note\s*:\s*([A-Z0-9\-]+)/i);

  if (factureMatch) {
    facture = factureMatch[1];
  }

  return {
    date: date,
    vendeur: clean(vendeur),
    client: clean(client),
    facture: clean(facture),
    montant: nettoyerMontant(montant)
  };
}

// ==========================
// ANALYSE
// ==========================
async function analyser() {

  const result = await Tesseract.recognize(imageSrc, 'fra');
  const txt = result.data.text;

  const data = extraire(txt);

  const res = await fetch("https://script.google.com/macros/s/AKfycbxd0neBvcwoucF8snN2MrXtesc0SIUWqlJsK4aO2fDKhsP2SBPqZirr3iIK-1QB9Lpj/exec", {
    method: "POST",
    body: JSON.stringify(data)
  });

  const json = await res.json();

  afficherResultat(data, json);
}

// ==========================
// AFFICHAGE
// ==========================
function afficherResultat(data, res) {

  let type = data.facture ? "Facture prioritaire" : "Client";

  document.getElementById("resultat").innerHTML = `
    <h3>${res.statut}</h3>

    <b>Recherche :</b> ${type}<br><br>

    Client : ${data.client}<br>
    Facture : ${data.facture}<br>
    Montant : ${data.montant}<br>

    Lignes : ${res.lignes.join(", ")}
  `;
}

</script>

</body>
</html>
